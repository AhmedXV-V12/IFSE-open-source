<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IFSE Open Indexer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..800&family=Inter:wght@400..700&display=swap">
<style>
:root { color-scheme: dark; --bg:#090909; --surface:#1C1C1C; --line:rgba(255,255,255,.12); --text:#fff; --text-3:rgba(255,255,255,.6); --accent:#155AB6; --danger:#ff5a5a; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: Inter, Cairo, system-ui, sans-serif; }
form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 20px; }
p { color: var(--text-3); font-size: 14px; line-height: 1.6; }
code { font-size: 13px; }
input { min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: #111; color: var(--text); font: inherit; }
button { min-height: 44px; border: 0; border-radius: 100px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
#err { color: var(--danger); font-size: 14px; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <h1>IFSE Open Indexer <small style="color:var(--text-3);font-weight:400">v{{ version }}</small></h1>
  <p>Enter the admin token: the <code>IFSE_ADMIN_TOKEN</code> variable, or the contents of <code>data/admin_token</code>.</p>
  <input type="password" name="token" autocomplete="current-password" required autofocus aria-label="Admin token">
  <button type="submit">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify({ token: e.target.token.value }) });
  const d = await r.json().catch(() => ({}));
  if (d.ok) location.reload(); else document.getElementById("err").textContent = d.error || "Sign-in failed";
});
</script>
</body>
</html>
