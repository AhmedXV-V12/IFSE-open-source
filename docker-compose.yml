# IFSE Open: two services sharing one index (the ifse-data volume)
#   search   public site + API           port SEARCH_PORT (owner sign-in: /owner)
#   indexer  crawler + index + dashboard port INDEXER_PORT (keep it private)
#
# Where each one listens on this machine comes from .env (install.sh /
# install.ps1 ask and write it):
#   SEARCH_BIND   0.0.0.0 = every network (LAN, server, internet), 127.0.0.1 = this machine only
#   INDEXER_BIND  127.0.0.1 by default: the dashboard controls the index
services:
  indexer:
    build: .
    command: ["python", "indexer/app.py"]
    restart: unless-stopped
    environment:
      - IFSE_ADMIN_TOKEN=${IFSE_ADMIN_TOKEN:-}
      - IFSE_SEARCH_URL=${SEARCH_URL:-}
      - IFSE_SEARCH_PUBLIC_PORT=${SEARCH_PORT:-5000}
    volumes:
      - ifse-data:/data
    ports:
      - "${INDEXER_BIND:-127.0.0.1}:${INDEXER_PORT:-5101}:5101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5101/health')"]
      interval: 30s
      timeout: 5s

  search:
    build: .
    command: ["python", "search/app.py"]
    restart: unless-stopped
    environment:
      - IFSE_RATE_PER_MIN=${IFSE_RATE_PER_MIN:-120}
      - IFSE_ADMIN_TOKEN=${IFSE_ADMIN_TOKEN:-}
    volumes:
      - ifse-data:/data:ro
      - ifse-site:/site     # the site design and its images
    ports:
      - "${SEARCH_BIND:-0.0.0.0}:${SEARCH_PORT:-5000}:5000"
    depends_on:
      - indexer
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/stats')"]
      interval: 30s
      timeout: 5s

volumes:
  ifse-data:
  ifse-site:
