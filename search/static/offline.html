<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090909">
    <title>IFelx — غير متصل</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="stylesheet" href="/style.css?v=open-1.0">
</head>
<body class="ifx-offline">
<main class="ifx-offline-card">
    <div class="ifx-hero-logo">
        <img src="/logow-352.webp" alt="IFelx Logo" width="120" height="120">
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>You are offline</p>
    <button type="button" class="ifx-btn-primary" id="retryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span>إعادة المحاولة · Retry</span>
    </button>
</main>
<script>
document.getElementById("retryBtn").addEventListener("click", () => location.reload());
window.addEventListener("online", () => location.reload());
</script>
</body>
</html>
