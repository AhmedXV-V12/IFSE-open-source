<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#090909">
    <title>IFSE Open — دخول صاحب المحرك</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&family=Inter:wght@400..700&display=swap">
    <link rel="stylesheet" href="/style.css?v=open-1.1">
    <link rel="stylesheet" href="/customize.css?v=open-1.1">
    <script src="/customize.js?v=open-1.1"></script>
    <style>
        .ifxo { min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
        .ifxo form { width: min(400px, 100%); display: flex; flex-direction: column; gap: 14px; padding: 28px;
                     background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); }
        .ifxo h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .ifxo p { color: var(--text-3); font-size: 14px; line-height: 1.7; }
        .ifxo code { direction: ltr; unicode-bidi: isolate; }
        .ifxo .err { color: var(--danger); min-height: 1.2em; font-size: 14px; }
    </style>
</head>
<body class="ifx-owner-page">
<main class="ifxo">
    <form id="f">
        <h1><img src="/logow-72.webp" alt="" width="32" height="32">دخول صاحب المحرك</h1>
        <p>اكتب رمز الإدارة (<code>IFSE_ADMIN_TOKEN</code>، أو محتوى <code>admin_token</code> في بيانات المفهرس). بعد الدخول يظهر زر الترس في الصفحة الرئيسية، وأي تصميم تحفظه يظهر لكل الزوار.</p>
        <input class="ifxc-input" type="password" name="token" autocomplete="current-password" required autofocus aria-label="رمز الإدارة" dir="ltr">
        <button class="ifxc-btn is-on" type="submit">دخول</button>
        <div class="err" id="err" role="alert"></div>
    </form>
</main>
<script>
document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const r = await fetch("/api/owner/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ token: e.target.token.value }) });
    const d = await r.json().catch(() => ({}));
    if (d.ok) location.href = "/?customize=1";
    else document.getElementById("err").textContent = d.error === "wrong token" ? "الرمز غير صحيح" : (d.error || "تعذّر الدخول");
});
</script>
</body>
</html>
